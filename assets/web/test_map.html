<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Qt 离线地图</title>
    <!-- 引入 Leaflet 的样式和脚本（适配降级后的 1.7.1 版本，解决 Jetson AGX 兼容性问题） -->
    <link rel="stylesheet" href="./leaflet.css" />
    <!-- 引入我们刚刚抽离出来的自定义样式 -->
    <link rel="stylesheet" href="./css/map.css" />
    <script src="./leaflet.js"></script>
</head>
<body>
    <!-- 这是一个给地图占位的空盒子 -->
    <div id="map"></div>

    <!-- 【需求 1.2】左下角控件 HTML 结构 -->
    <div class="custom-controls">
        <button class="map-btn" id="btn-zoom-in" title="放大">＋</button>
        <button class="map-btn" id="btn-zoom-out" title="缩小">－</button>
        <button class="map-btn" id="btn-fullscreen" title="全屏/退出全屏">⛶</button>
        <button class="map-btn" id="btn-locate" title="定位到当前目标">◎</button>
        <button class="map-btn" id="btn-toggle-map" title="切换卫星实景图">🗺️</button>
        <button class="map-btn" id="btn-measure" title="距离测量 (开启/关闭)">📏</button>
    </div>

    <!-- 【需求 1.6】右下角云台姿态仪表盘 -->
    <div class="dashboard-container">
        <div class="dash-item">
            <div class="dash-img-box">
                <!-- 请确保图片已拷贝到相应目录 -->
                <img class="dash-bg" src="./images/base-1.png" alt="俯仰角底盘" onerror="this.style.display='none'">
                <!-- 注意：在 CSS 初始化时也带上偏移量 -->
                <img class="dash-needle" id="needle-pitch" style="transform: rotate(-226deg)" src="./images/needle.png" alt="指针" onerror="this.style.backgroundColor='red'; this.style.borderRadius='50%'">
            </div>
            <div class="dash-info">
                <p class="dash-label">俯仰角</p>
                <p class="dash-angle" id="val-pitch">-91°</p>
            </div>
        </div>
        <div class="dash-item">
            <div class="dash-img-box">
                <img class="dash-bg" src="./images/base-2.png" alt="水平角底盘" onerror="this.style.display='none'">
                <img class="dash-needle" id="needle-yaw" style="transform: rotate(65deg)" src="./images/needle.png" alt="指针" onerror="this.style.backgroundColor='green'; this.style.borderRadius='50%'">
            </div>
            <div class="dash-info">
                <p class="dash-label">水平角</p>
                <p class="dash-angle" id="val-yaw">110°</p>
            </div>
        </div>
    </div>

    <!-- 模块化引入业务逻辑脚本 -->
    <script src="./js/map_core.js"></script>
    <script src="./js/map_measure.js"></script>
</body>
</html>
