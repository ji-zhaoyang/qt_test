<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>白名单区域</title>
    <link rel="stylesheet" href="./leaflet.css" />
    <link rel="stylesheet" href="./css/map.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #eef1f5;
        }
        #map {
            width: 100%;
            height: 100%;
        }
        .area-toolbar {
            position: absolute;
            left: 16px;
            bottom: 16px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #d8dde6;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }
        .area-tool-btn {
            width: 34px;
            height: 34px;
            border: 1px solid #d0d5de;
            border-radius: 4px;
            background: #ffffff;
            color: #333;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .area-tool-btn:hover {
            background: #f5f7fa;
        }
        .area-tool-btn.active {
            border-color: #f2994a;
            background: #fff4ea;
            color: #f2994a;
        }
    </style>
    <script src="./leaflet.js"></script>
</head>
<body>
    <div id="map"></div>
    <div class="area-toolbar">
        <button class="area-tool-btn" id="tool-polygon" title="多边形">⬠</button>
        <button class="area-tool-btn" id="tool-circle" title="圆形">◯</button>
        <button class="area-tool-btn" id="tool-rectangle" title="矩形">▭</button>
        <button class="area-tool-btn" id="tool-delete" title="删除">🗑</button>
    </div>
    <script src="./js/whitelist_area.js"></script>
</body>
</html>
